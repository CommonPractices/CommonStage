{# _head.html — the CommonStage shared <head> + theme bootstrap.
   Identical across every CommonStage site; include it, never copy it.
   Requires the caller to pass `page_title`. #}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="/foundation.css">
  <link rel="stylesheet" href="/stage.css">
  <script>
    // Honour the OS setting on first paint, then let the picker override.
    (function () {
      var root = document.documentElement, saved = null;
      try { saved = localStorage.getItem('cs-theme'); } catch (e) {}
      if (saved) root.setAttribute('data-theme', saved);
      else if (matchMedia('(prefers-color-scheme: dark)').matches) root.setAttribute('data-theme', 'dark');
    })();
  </script>
